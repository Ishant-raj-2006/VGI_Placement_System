services:
  - type: web
    name: cpms-api
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: MONGO_MAX_POOL_SIZE
        value: "5"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        value: https://vgi-placement-system.vercel.app
      - key: CORS_ORIGINS
        value: https://vgi-placement-system.vercel.app
      - key: STORAGE_DRIVER
        value: mongodb
      - key: EXPOSE_DEV_TOKENS
        value: "false"
      - key: JOBS_ENABLED
        value: "true"
